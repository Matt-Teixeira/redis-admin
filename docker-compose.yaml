# Compose v2 (no "version:" key needed)
x-common: &common
  image: redis:7-alpine
  restart: unless-stopped
  command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
  ulimits:
    nofile:
      soft: 10032
      hard: 10032
  healthcheck:
    test: ["CMD", "redis-cli", "ping"]
    interval: 10s
    timeout: 3s
    retries: 5
  networks:
    redis_net:
      ipv4_address: 0.0.0.0 # overwritten per service

services:
  redis-PROD:
    <<: *common
    container_name: redis-PROD
    volumes:
      - prod_data:/data
      # Long-form bind with create_host_path:false — a bad source path fails
      # loudly instead of being auto-created as an empty directory (which Redis
      # would silently read as an empty config and fall back to defaults).
      - type: bind
        source: ./config/prod.config
        target: /usr/local/etc/redis/redis.conf
        read_only: true
        bind:
          create_host_path: false
    networks:
      redis_net:
        ipv4_address: "${REDIS_PROD_IP}"

  redis-STAGING:
    <<: *common
    container_name: redis-STAGING
    volumes:
      - staging_data:/data
      - type: bind
        source: ./config/staging.config
        target: /usr/local/etc/redis/redis.conf
        read_only: true
        bind:
          create_host_path: false
    networks:
      redis_net:
        ipv4_address: "${REDIS_STAGING_IP}"

  redis_dev-0-4:
    <<: *common
    container_name: redis_dev-0-4
    volumes:
      - dev04_data:/data
      - type: bind
        source: ./config/dev04.config
        target: /usr/local/etc/redis/redis.conf
        read_only: true
        bind:
          create_host_path: false
    networks:
      redis_net:
        ipv4_address: "${REDIS_DEV04_IP}"

  redis_dev-0-5:
    <<: *common
    container_name: redis_dev-0-5
    volumes:
      - dev05_data:/data
      - type: bind
        source: ./config/dev05.config
        target: /usr/local/etc/redis/redis.conf
        read_only: true
        bind:
          create_host_path: false
    networks:
      redis_net:
        ipv4_address: "${REDIS_DEV05_IP}"

networks:
  redis_net:
    driver: bridge
    ipam:
      config:
        - subnet: "${REDIS_SUBNET}"
          gateway: "${REDIS_GATEWAY}"

volumes:
  prod_data:
  staging_data:
  dev04_data:
  dev05_data:
