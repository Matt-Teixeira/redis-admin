# Compose v2 (no "version:" key needed)
x-common: &common
  image: redis:7-alpine
  restart: unless-stopped
  command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
  ulimits:
    nofile:
      soft: 10032
      hard: 10032
  # Cap container log growth (audit OPS-02) — tracked here, not in daemon.json,
  # so a rebuilt server gets it for free. Takes effect at next recreate.
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"
  # redis-cli exits 0 even when the server refuses (e.g. NOAUTH), so the reply
  # text must be checked. This plain variant is kept for any future passwordless
  # instance; since 2026-08-19 ALL FOUR instances are auth'd and override it
  # with x-auth-healthcheck.
  healthcheck:
    test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
    interval: 10s
    timeout: 3s
    retries: 5
  networks:
    redis_net:
      ipv4_address: 0.0.0.0 # overwritten per service

# Authenticated variants (REDIS-01 rollout 2026-08-18). The password stays in a
# root-only host file; the healthcheck parses it inside the container, so no
# secret appears in this file or in `docker inspect`.
x-auth-healthcheck: &auth_healthcheck
  test: ["CMD-SHELL", "redis-cli -a \"$$(awk '/^requirepass/{print $$2}' /usr/local/etc/redis/auth.conf)\" --no-auth-warning ping | grep -q PONG"]
  interval: 10s
  timeout: 3s
  retries: 5

x-auth-mount: &auth_mount
  type: bind
  source: /opt/resources/secrets/redis_auth.conf
  target: /usr/local/etc/redis/auth.conf
  read_only: true
  bind:
    create_host_path: false

services:
  redis-PROD:
    <<: *common
    container_name: redis-PROD
    healthcheck: *auth_healthcheck
    volumes:
      - prod_data:/data
      # Long-form bind with create_host_path:false — a bad source path fails
      # loudly instead of being auto-created as an empty directory (which Redis
      # would silently read as an empty config and fall back to defaults).
      - type: bind
        source: ./config/prod.config
        target: /usr/local/etc/redis/redis.conf
        read_only: true
        bind:
          create_host_path: false
      - *auth_mount
    networks:
      redis_net:
        ipv4_address: "${REDIS_PROD_IP}"

  redis-STAGING:
    <<: *common
    container_name: redis-STAGING
    healthcheck: *auth_healthcheck
    volumes:
      - staging_data:/data
      - type: bind
        source: ./config/staging.config
        target: /usr/local/etc/redis/redis.conf
        read_only: true
        bind:
          create_host_path: false
      - *auth_mount
    networks:
      redis_net:
        ipv4_address: "${REDIS_STAGING_IP}"

  redis_dev-0-4:
    <<: *common
    container_name: redis_dev-0-4
    healthcheck: *auth_healthcheck
    volumes:
      - dev04_data:/data
      - type: bind
        source: ./config/dev04.config
        target: /usr/local/etc/redis/redis.conf
        read_only: true
        bind:
          create_host_path: false
      - *auth_mount
    networks:
      redis_net:
        ipv4_address: "${REDIS_DEV04_IP}"

  redis_dev-0-5:
    <<: *common
    container_name: redis_dev-0-5
    healthcheck: *auth_healthcheck
    volumes:
      - dev05_data:/data
      - type: bind
        source: ./config/dev05.config
        target: /usr/local/etc/redis/redis.conf
        read_only: true
        bind:
          create_host_path: false
      - *auth_mount
    networks:
      redis_net:
        ipv4_address: "${REDIS_DEV05_IP}"

networks:
  redis_net:
    driver: bridge
    ipam:
      config:
        - subnet: "${REDIS_SUBNET}"
          gateway: "${REDIS_GATEWAY}"

volumes:
  prod_data:
  staging_data:
  dev04_data:
  dev05_data:
